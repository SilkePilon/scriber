name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Every tag build force-pushes the whole ostree repo to gh-pages, so two of them
# must never overlap: if a slower older run finishes last it republishes a stale
# repo, and every install and update then points back at the previous release.
# Serialised rather than cancelled — cancelling a run mid-push would leave
# gh-pages holding a half-written repo, which is worse than a slow queue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install the flatpak toolchain
        run: dnf install -y flatpak flatpak-builder git ostree

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache the flatpak-builder state
        # WHY THIS WORKS AT ALL. flatpak-builder keeps one ostree ref per module
        # in .flatpak-builder/cache (`build-opencascade`, `build-scriber`,
        # `cleanup`, `finish`) and keys each on that module's own definition plus
        # everything before it. opencascade is the FIRST module, so its entry
        # depends on nothing but itself: editing Rust sources changes only
        # `build-scriber` and later, and OCCT is restored rather than rebuilt.
        # Measured on this exact manifest, in fedora:44 on a 32-core machine:
        # 437 s for the cold flatpak-builder invocation against an empty state
        # dir, 8 s for the next one against a warm one, with the Rust sources
        # edited in between and 0 OCCT compiler invocations in the log. A
        # 2-core hosted runner does not change the shape of that, only the
        # first number — which is why the release job takes over an hour today.
        #
        # THE KEY. hashFiles() over the manifest, because the manifest is where
        # both halves of OCCT's identity live — the tarball sha256 and the
        # config-opts. Nothing else needs to be in the key: the Rust sources are
        # NOT in it, deliberately, since including them would invalidate the
        # cache on every commit and defeat the whole point. The manifest does
        # also describe the scriber module, so touching it costs a miss, but a
        # miss lands on the restore-key below and flatpak-builder then re-uses
        # the still-valid `build-opencascade` ref anyway.
        #
        # THE PATHS. `cache` is the ostree repo that makes the skip possible and
        # `downloads` is the 45 MB OCCT tarball; `ccache` is what stops a
        # config-opts tweak falling all the way back to a cold compile. Verified
        # by deleting everything else from a warm state dir and re-running:
        # `build/`, `rofiles/` and `checksums/` are NOT required for the skip.
        # `build/` in particular is 112 MB of per-module scratch that
        # flatpak-builder recreates from the cache each run, so caching it would
        # pay upload and download cost for nothing.
        #
        # SCOPE, the part that is easy to get wrong. Actions caches are scoped
        # to the ref that wrote them, plus the default branch. This job runs on
        # `refs/tags/v*`, and every release is a DIFFERENT tag, so a cache saved
        # here can never be read by the next release. What makes the hit happen
        # is the `flatpak` job in ci.yml, which runs on the default branch under
        # the same key and therefore writes the one scope a tag run can read.
        # Saving here is still worth its ~930 MB: a re-run of a tag IS the same
        # ref, so it restores. This project has already lost one release to a
        # failure at the signing step, after OCCT had finished compiling; the
        # retry of that tag now starts warm.
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/ccache
            .flatpak-builder/downloads
          key: flatpak-builder-fedora44-gnome50-${{ hashFiles('build-aux/io.github.SilkePilon.Scriber.yaml') }}
          restore-keys: |
            flatpak-builder-fedora44-gnome50-

      - name: Bound the ccache size
        # flatpak-builder writes no ccache.conf of its own — verified: with
        # --ccache it creates only the 16 hash directories and a bin/ of
        # compiler symlinks — so this file is the only place the ceiling can be
        # set, and ccache does read it (`ccache -p` reports
        # "(.flatpak-builder/ccache/ccache.conf) max_size = 1.0 GB").
        #
        # It matters because this directory is uploaded to the Actions cache.
        # ccache defaults to 5 GiB; the repository's whole cache budget is
        # 10 GiB, and blowing half of it on one entry would start evicting the
        # very entries that make the release fast. One cold OCCT 8.0.1 build
        # measures 762 MB of ccache, so 1 GiB holds a complete build with
        # headroom while bounding what a future OCCT can grow this to.
        run: |
          mkdir -p .flatpak-builder/ccache
          printf 'max_size = 1.0G\n' > .flatpak-builder/ccache/ccache.conf

      - name: Add flathub and install the runtime
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

          # The manifest lists rust-stable under sdk-extensions with NO version,
          # so flatpak-builder resolves the branch itself from the SDK. Hardcoding
          # a second, independent pin here would drift: the extension's branch
          # tracks the *Freedesktop* SDK underneath org.gnome.Sdk, not the GNOME
          # major version, and the two move on different schedules (GNOME 50
          # currently sits on Freedesktop 25.08). Read the branch out of the SDK's
          # own metadata so there is exactly one source of truth.
          RUST_BRANCH=$(flatpak info --show-metadata org.gnome.Sdk//50 |
            sed -n '/^\[Extension org\.freedesktop\.Sdk\.Extension\]$/,/^\[/{s/^version *= *//p}')
          if [ -z "$RUST_BRANCH" ]; then
            echo "Could not read the Freedesktop SDK extension branch from org.gnome.Sdk//50." >&2
            echo "Check the [Extension org.freedesktop.Sdk.Extension] section of its metadata." >&2
            exit 1
          fi
          echo "Resolved rust-stable branch to $RUST_BRANCH"
          flatpak install -y --noninteractive flathub \
            "org.freedesktop.Sdk.Extension.rust-stable//${RUST_BRANCH}"

      - name: Import the signing key
        # GnuPG 2 routes every private-key operation through gpg-agent, and the
        # agent's only default way to obtain a passphrase is to spawn a pinentry.
        # fedora:44 ships none, so the agent aborts with "No pinentry" — which is
        # exactly what killed the first tagged release, at the `ostree commit
        # --gpg-sign` flatpak-builder runs at the very end of the build.
        #
        # Measured in fedora:44 with the package set installed above; the
        # operation is `ostree commit --gpg-sign`, i.e. what flatpak-builder does
        # internally:
        #
        #   secret key    gpg config                     result
        #   unprotected   stock                          signs
        #   protected     stock                          "GPG Agent: No pinentry"
        #   protected     loopback only                  "GPGME: General error"
        #   protected     loopback + preset passphrase   signs
        #
        # So loopback on its own does NOT rescue a passphrase-protected key: the
        # agent still has no passphrase, it just fails differently. The passphrase
        # has to be handed to the agent up front, which is what
        # gpg-preset-passphrase does. Set the FLATPAK_GPG_PASSPHRASE secret if the
        # key is protected; leave it unset if it is not.
        #
        # The `pinentry` package is deliberately NOT installed: it fixes nothing
        # here. /usr/bin/pinentry is pinentry-curses, which wants a TTY this job
        # does not have, and with it installed the protected-key failures above
        # merely become "Pinentry: Inappropriate ioctl for device". Every
        # configuration that signs successfully does so with no pinentry present.
        # Please do not "fix" this by adding the package.
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          GPG_KEYID: ${{ secrets.FLATPAK_GPG_KEYID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg

          # The TTLs have to outlast the whole build: the signing happens at the
          # end of it, and a cache expiry would drop us straight back into
          # needing a pinentry.
          cat > ~/.gnupg/gpg-agent.conf <<'CONF'
          allow-loopback-pinentry
          allow-preset-passphrase
          default-cache-ttl 86400
          max-cache-ttl 86400
          CONF

          cat > ~/.gnupg/gpg.conf <<'CONF'
          pinentry-mode loopback
          batch
          no-tty
          CONF

          # Must happen before the import, so the agent picks the config up.
          gpgconf --kill gpg-agent

          echo "$KEY" | base64 -d | gpg --batch --import

          if [ -n "${PASSPHRASE:-}" ]; then
            gpg-connect-agent /bye >/dev/null
            LIBEXEC=$(gpgconf --list-dirs libexecdir)
            # Every keygrip in the keyring, rather than just the one GPG_KEYID
            # names: the signature is made by the signing subkey, which is a
            # different keygrip from the primary key.
            for grip in $(gpg --batch --with-colons --with-keygrip \
                --list-secret-keys | awk -F: '/^grp:/{print $10}'); do
              printf '%s' "$PASSPHRASE" | "$LIBEXEC/gpg-preset-passphrase" --preset "$grip"
            done
          fi

          # Prove the agent can actually produce a signature now, instead of
          # discovering it cannot forty minutes later once OCCT has finished
          # compiling. This asserts nothing about the artifact; it only fails the
          # same failure earlier.
          if ! echo preflight | gpg --batch --yes --local-user "$GPG_KEYID" \
              --sign --output /dev/null; then
            echo "The signing key cannot produce a signature in this job." >&2
            echo "If the key is passphrase-protected, set the" >&2
            echo "FLATPAK_GPG_PASSPHRASE secret. See the comment on this step." >&2
            exit 1
          fi

      - name: Fetch the existing repository
        # Keeps history so users receive deltas rather than full redownloads.
        # The branch is probed explicitly rather than falling back on any clone
        # failure: a transient network or auth error must abort the job, because
        # the later force-push would otherwise replace gh-pages with a
        # one-commit repo and destroy every published release's ostree objects.
        run: |
          set -euo pipefail
          REMOTE="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$REMOTE" pages
          else
            echo "gh-pages does not exist yet — first release"
            mkdir -p pages
          fi

      - name: Build
        env:
          GPG_KEYID: ${{ secrets.FLATPAK_GPG_KEYID }}
        # --ccache is the second line of defence behind the module cache above.
        # When the manifest changes, `build-opencascade` is invalidated and OCCT
        # is compiled again — but with ccache the recompile only pays for the
        # translation units the change actually touched. It costs nothing on a
        # full cache hit, because the module is skipped before any compiler runs.
        #
        # No package needs installing for this: the compilers run INSIDE the
        # flatpak sandbox, and org.gnome.Sdk//50 already ships /usr/bin/ccache
        # (verified in the SDK itself). Adding ccache to the dnf line above would
        # install it on the host, where nothing compiles.
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse --ccache \
            --repo=pages/repo \
            --gpg-sign="$GPG_KEYID" \
            build-dir build-aux/io.github.SilkePilon.Scriber.yaml

      - name: Assert OCCT is dynamically linked in the shipped binary
        # CI checks the host build, which links Fedora's system OCCT and so can
        # never regress. This is the artifact users actually receive, and the
        # one whose linkage the manifest controls. libTK* resolving to "not
        # found" on the host is expected — the DT_NEEDED entries are the proof.
        run: ./scripts/check-dynamic-occt.sh build-dir/files/bin/scriber

      - name: Run the shipped binary
        # Nothing else between the build and the upload executes the artifact.
        # CYLINDRICAL_SURFACE proves the boolean actually ran, rather than an
        # uncut block having been exported.
        #
        # Both assertions run INSIDE the sandbox, and have to. `flatpak-builder
        # --run` gives the sandbox a private /tmp: measured in fedora:44, a file
        # written to /tmp in there does not exist outside it. Reading the output
        # back from this job's shell — which is what this step used to do —
        # therefore fails on a missing file however good the artifact is. This
        # step had never executed before, because the release died at signing.
        run: |
          set -euo pipefail
          flatpak-builder --run build-dir \
            build-aux/io.github.SilkePilon.Scriber.yaml \
            sh -euc '
              scriber smoke --output /tmp/release-check.step
              head -c 13 /tmp/release-check.step | grep -q "ISO-10303-21;"
              grep -q "CYLINDRICAL_SURFACE" /tmp/release-check.step
            '

      - name: Update repository metadata and generate deltas
        env:
          GPG_KEYID: ${{ secrets.FLATPAK_GPG_KEYID }}
        run: |
          flatpak build-update-repo \
            --generate-static-deltas --prune \
            --gpg-sign="$GPG_KEYID" \
            pages/repo

      - name: Build the standalone bundle
        env:
          GPG_KEYID: ${{ secrets.FLATPAK_GPG_KEYID }}
        run: |
          # --runtime-repo is what makes `flatpak install --bundle` work on a
          # clean machine: a bundle carries the app but not org.gnome.Platform//50,
          # and without a runtime repo URL recorded inside it the install aborts
          # on a machine that has no flathub remote. README documents that path.
          #
          # --gpg-keys embeds the public half of the signing key in the bundle so
          # it verifies against itself; --gpg-sign alone signs with a key the user
          # would have to fetch separately. scriber.gpg is at the repo root and
          # this step runs in the checkout, same as the `pages/repo` path below.
          flatpak build-bundle pages/repo \
            "Scriber-${GITHUB_REF_NAME}-x86_64.flatpak" \
            io.github.SilkePilon.Scriber \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --gpg-keys=scriber.gpg \
            --gpg-sign="$GPG_KEYID"

      - name: Write the remote definitions
        run: |
          cp scriber.gpg pages/scriber.gpg
          KEY_B64=$(base64 -w0 scriber.gpg)
          BASE="https://SilkePilon.github.io/scriber"

          cat > pages/scriber.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Scriber
          Url=${BASE}/repo/
          Homepage=https://github.com/SilkePilon/scriber
          Comment=Local-only 3D CAD for GNOME
          GPGKey=${KEY_B64}
          EOF

          cat > pages/scriber.flatpakref <<EOF
          [Flatpak Ref]
          Title=Scriber
          Name=io.github.SilkePilon.Scriber
          Branch=master
          Url=${BASE}/repo/
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=${KEY_B64}
          EOF

      - name: Publish to Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pages
          git init -b gh-pages 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "release ${GITHUB_REF_NAME}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Scriber-*.flatpak
