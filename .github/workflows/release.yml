name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Every tag build force-pushes the whole ostree repo to gh-pages, so two of them
# must never overlap: if a slower older run finishes last it republishes a stale
# repo, and every install and update then points back at the previous release.
# Serialised rather than cancelled — cancelling a run mid-push would leave
# gh-pages holding a half-written repo, which is worse than a slow queue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install the flatpak toolchain
        run: dnf install -y flatpak flatpak-builder git ostree

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Add flathub and install the runtime
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

          # The manifest lists rust-stable under sdk-extensions with NO version,
          # so flatpak-builder resolves the branch itself from the SDK. Hardcoding
          # a second, independent pin here would drift: the extension's branch
          # tracks the *Freedesktop* SDK underneath org.gnome.Sdk, not the GNOME
          # major version, and the two move on different schedules (GNOME 50
          # currently sits on Freedesktop 25.08). Read the branch out of the SDK's
          # own metadata so there is exactly one source of truth.
          RUST_BRANCH=$(flatpak info --show-metadata org.gnome.Sdk//50 |
            sed -n '/^\[Extension org\.freedesktop\.Sdk\.Extension\]$/,/^\[/{s/^version *= *//p}')
          if [ -z "$RUST_BRANCH" ]; then
            echo "Could not read the Freedesktop SDK extension branch from org.gnome.Sdk//50." >&2
            echo "Check the [Extension org.freedesktop.Sdk.Extension] section of its metadata." >&2
            exit 1
          fi
          echo "Resolved rust-stable branch to $RUST_BRANCH"
          flatpak install -y --noninteractive flathub \
            "org.freedesktop.Sdk.Extension.rust-stable//${RUST_BRANCH}"

      - name: Import the signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: echo "$KEY" | base64 -d | gpg --batch --import

      - name: Fetch the existing repository
        # Keeps history so users receive deltas rather than full redownloads.
        # The branch is probed explicitly rather than falling back on any clone
        # failure: a transient network or auth error must abort the job, because
        # the later force-push would otherwise replace gh-pages with a
        # one-commit repo and destroy every published release's ostree objects.
        run: |
          set -euo pipefail
          REMOTE="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$REMOTE" pages
          else
            echo "gh-pages does not exist yet — first release"
            mkdir -p pages
          fi

      - name: Build
        env:
          GPG_KEYID: ${{ secrets.FLATPAK_GPG_KEYID }}
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --repo=pages/repo \
            --gpg-sign="$GPG_KEYID" \
            build-dir build-aux/io.github.SilkePilon.Scriber.yaml

      - name: Assert OCCT is dynamically linked in the shipped binary
        # CI checks the host build, which links Fedora's system OCCT and so can
        # never regress. This is the artifact users actually receive, and the
        # one whose linkage the manifest controls. libTK* resolving to "not
        # found" on the host is expected — the DT_NEEDED entries are the proof.
        run: ./scripts/check-dynamic-occt.sh build-dir/files/bin/scriber

      - name: Run the shipped binary
        # Nothing else between the build and the upload executes the artifact.
        # CYLINDRICAL_SURFACE proves the boolean actually ran, rather than an
        # uncut block having been exported.
        run: |
          set -euo pipefail
          flatpak-builder --run build-dir \
            build-aux/io.github.SilkePilon.Scriber.yaml \
            scriber smoke --output /tmp/release-check.step
          head -c 13 /tmp/release-check.step | grep -q 'ISO-10303-21;'
          grep -q 'CYLINDRICAL_SURFACE' /tmp/release-check.step

      - name: Update repository metadata and generate deltas
        env:
          GPG_KEYID: ${{ secrets.FLATPAK_GPG_KEYID }}
        run: |
          flatpak build-update-repo \
            --generate-static-deltas --prune \
            --gpg-sign="$GPG_KEYID" \
            pages/repo

      - name: Build the standalone bundle
        env:
          GPG_KEYID: ${{ secrets.FLATPAK_GPG_KEYID }}
        run: |
          # --runtime-repo is what makes `flatpak install --bundle` work on a
          # clean machine: a bundle carries the app but not org.gnome.Platform//50,
          # and without a runtime repo URL recorded inside it the install aborts
          # on a machine that has no flathub remote. README documents that path.
          #
          # --gpg-keys embeds the public half of the signing key in the bundle so
          # it verifies against itself; --gpg-sign alone signs with a key the user
          # would have to fetch separately. scriber.gpg is at the repo root and
          # this step runs in the checkout, same as the `pages/repo` path below.
          flatpak build-bundle pages/repo \
            "Scriber-${GITHUB_REF_NAME}-x86_64.flatpak" \
            io.github.SilkePilon.Scriber \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --gpg-keys=scriber.gpg \
            --gpg-sign="$GPG_KEYID"

      - name: Write the remote definitions
        run: |
          cp scriber.gpg pages/scriber.gpg
          KEY_B64=$(base64 -w0 scriber.gpg)
          BASE="https://SilkePilon.github.io/scriber"

          cat > pages/scriber.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Scriber
          Url=${BASE}/repo/
          Homepage=https://github.com/SilkePilon/scriber
          Comment=Local-only 3D CAD for GNOME
          GPGKey=${KEY_B64}
          EOF

          cat > pages/scriber.flatpakref <<EOF
          [Flatpak Ref]
          Title=Scriber
          Name=io.github.SilkePilon.Scriber
          Branch=master
          Url=${BASE}/repo/
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=${KEY_B64}
          EOF

      - name: Publish to Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pages
          git init -b gh-pages 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "release ${GITHUB_REF_NAME}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Scriber-*.flatpak
