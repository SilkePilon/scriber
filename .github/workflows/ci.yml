name: CI

on:
  push:
    branches: [main]
  pull_request:

# This job fetches and executes a third-party script, so it gets no more than
# the read access it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Fedora 44 ships OCCT 7.9.3, matching the documented development
    # environment. Ubuntu runners carry an OCCT too old for the TKDE* names.
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y opencascade-devel cmake gcc-c++ git python3 python3-pip

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache the cargo registry and target directory
        # Must come after the toolchain step: the cache key includes the rustc
        # version, and rust-cache reads it by invoking the compiler.
        #
        # CAVEAT, since this workspace is not pure Rust. rust-cache saves
        # ~/.cargo plus target/, but before saving it deletes the artifacts of
        # the workspace's OWN crates and keeps only third-party dependencies —
        # otherwise the cache would grow without bound. crates/scriber-occt is a
        # workspace member, so the C++ that its build.rs compiles through
        # cxx-build (shim.cpp, the cxxbridge glue, libscriber-occt-shim.a) is
        # NOT cached and is rebuilt every run. That is a handful of translation
        # units. What this does cache is the dependency tree — cxx, clap, serde
        # and friends — which is the bulk of a cold `cargo test --workspace`.
        #
        # Nothing here weakens a check: every dependency is still compiled from
        # the same pinned Cargo.lock, and the key changes when Cargo.lock or the
        # toolchain does. The OCCT the shim compiles against comes from the
        # image's opencascade-devel and is outside the key, which is safe
        # precisely because the shim objects are the part that is never cached.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Assert OCCT is dynamically linked
        run: |
          cargo build --bin scriber
          ./scripts/check-dynamic-occt.sh target/debug/scriber

      - name: Assert the vendored cargo sources are current
        # Flatpak builds offline, so build-aux/cargo-sources.json must match
        # Cargo.lock exactly. A stale file fails inside the sandbox with an
        # opaque "no matching package" error, so catch it here instead.
        run: |
          python3 -m venv /tmp/cargo-sources-venv
          /tmp/cargo-sources-venv/bin/pip install --quiet aiohttp toml tomlkit
          # Pinned to a commit: this script is downloaded and executed, so a
          # mutable branch ref would let upstream change what runs here.
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/737c0085912f9f7dabf9341d4608e2a77a51a73a/cargo/flatpak-cargo-generator.py', '/tmp/flatpak-cargo-generator.py')"
          /tmp/cargo-sources-venv/bin/python /tmp/flatpak-cargo-generator.py \
            Cargo.lock -o /tmp/cargo-sources.json
          if ! diff -u build-aux/cargo-sources.json /tmp/cargo-sources.json; then
            echo "build-aux/cargo-sources.json is stale relative to Cargo.lock." >&2
            echo "Regenerate it with flatpak-cargo-generator.py and commit the result." >&2
            exit 1
          fi

  # The job above builds against Fedora 44's OCCT 7.9.3, but the Flatpak ships
  # OCCT 8.0.1. That exact pair has already broken this project once: OCCT 8.0
  # removed Standard_Failure::DynamicType() and reparented the class from
  # Standard_Transient onto std::exception, which compiled cleanly on 7.9.3 and
  # failed only inside the Flatpak build. shim.hpp now branches on
  # OCC_VERSION_MAJOR, so the 8.x half is invisible to a 7.9.3 compiler and
  # needs its own job to be checked at all.
  #
  # WHAT THIS JOB DOES NOT COVER, stated plainly rather than implied: it compiles
  # against OCCT 8 headers, it does not link or run against OCCT 8. build.rs's
  # TKDE*/libTK* toolkit names, symbol availability at link time, and the shim's
  # runtime behaviour on 8.0.1 are exercised only by the release workflow's full
  # Flatpak build, which does not run until a v* tag is pushed. Closing that gap
  # means compiling OCCT from source (tens of minutes per run), which is why it
  # is deliberately not done here.
  occt8-shim:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y cmake gcc-c++ git tar gzip

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Compile the shim against the OCCT version the Flatpak ships
        run: |
          set -euo pipefail
          MANIFEST=build-aux/io.github.SilkePilon.Scriber.yaml

          # Read the pin out of the manifest instead of repeating it here, so
          # this check follows the shipped OCCT automatically when it is bumped
          # and cannot silently drift into testing a version nobody receives.
          URL=$(sed -n 's/^ *url: *//p' "$MANIFEST" | head -1)
          SHA=$(sed -n 's/^ *sha256: *//p' "$MANIFEST" | head -1)
          case "$URL" in
            *OCCT*.tar.gz) ;;
            *)
              echo "Expected the first manifest source to be the OCCT archive." >&2
              echo "Got: '$URL'. Update this job alongside the manifest." >&2
              exit 1
              ;;
          esac
          echo "Checking the shim against $URL"

          curl -fsSL "$URL" -o /tmp/occt.tar.gz
          echo "${SHA}  /tmp/occt.tar.gz" | sha256sum -c -
          mkdir -p /tmp/occt-src
          tar -xzf /tmp/occt.tar.gz -C /tmp/occt-src --strip-components=1

          # CONFIGURE ONLY — this compiles no OCCT code and takes seconds. It
          # runs because configuring is what generates Standard_Version.hxx (the
          # header defining OCC_VERSION_MAJOR, which is templated, not checked
          # in) and collects every public header into include/opencascade. The
          # flags mirror the manifest's config-opts so the collected header set
          # is the one that actually ships.
          cmake -S /tmp/occt-src -B /tmp/occt-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_TK=OFF

          VERSION_HEADER=/tmp/occt-build/include/opencascade/Standard_Version.hxx
          test -f "$VERSION_HEADER"
          # Print it, so a version bump is legible in the log rather than
          # something you have to infer from the manifest diff.
          grep '^#define OCC_VERSION_COMPLETE' "$VERSION_HEADER"

          # `cargo check` still runs build.rs, and build.rs runs cxx_build, so
          # shim.cpp — and with it the OCC_VERSION_MAJOR >= 8 branch of shim.hpp
          # — is compiled in full. Nothing is linked, which is exactly why no
          # OCCT library has to be built.
          OCCT_ROOT=/tmp/occt-build cargo check -p scriber-occt

  # WHY THIS JOB EXISTS, and it is not the obvious reason. release.yml caches
  # .flatpak-builder so that a tagged build restores OCCT instead of spending
  # the better part of an hour compiling it. On its own that cache would never
  # once be hit:
  # GitHub scopes a cache to the ref that wrote it plus the DEFAULT BRANCH, and
  # release.yml runs on refs/tags/v*, a different ref for every release. A cache
  # written by the v0.1.0 build is invisible to the v0.1.1 build.
  #
  # The default-branch scope is the only one every tag run can read, so
  # something has to run on the default branch and write the key release.yml
  # looks up. That is this job. It uses the same key, the same image, the same
  # runtime and the same flatpak-builder invocation, so what it leaves behind is
  # a cache the release build can use directly.
  #
  # PRECONDITION, stated because the whole design rests on it: `main` must be
  # this repository's default branch. If the default branch is renamed, change
  # the `on: push: branches:` filter at the top of this file with it or the
  # release job silently goes back to hour-long builds.
  #
  # It is also the first thing in CI that LINKS and RUNS against OCCT 8 rather
  # than merely compiling headers against it — the gap the comment on
  # occt8-shim above describes in full. That is a bonus, not the motivation.
  flatpak:
    # Push only, which given the trigger at the top of this file means the
    # default branch. Pull requests are deliberately excluded: a PR's cache
    # lands in the PR's own scope, which no release run can read, so it would
    # add minutes to every PR and warm nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install the flatpak toolchain
        run: dnf install -y flatpak flatpak-builder git ostree

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache the flatpak-builder state
        # Key and paths are identical to release.yml's restore step by
        # construction — see the long comment there for why the manifest is the
        # right thing to hash and why build/ is excluded. If you change one,
        # change the other, or the release build stops hitting this cache.
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/ccache
            .flatpak-builder/downloads
          key: flatpak-builder-fedora44-gnome50-${{ hashFiles('build-aux/io.github.SilkePilon.Scriber.yaml') }}
          restore-keys: |
            flatpak-builder-fedora44-gnome50-

      - name: Bound the ccache size
        # Mirrors release.yml; see the comment there for why 1 GiB.
        run: |
          mkdir -p .flatpak-builder/ccache
          printf 'max_size = 1.0G\n' > .flatpak-builder/ccache/ccache.conf

      - name: Add flathub and install the runtime
        # Same resolution dance as release.yml: the manifest pins no branch for
        # rust-stable, so it is read out of the SDK's own metadata rather than
        # hardcoded a second time.
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50
          RUST_BRANCH=$(flatpak info --show-metadata org.gnome.Sdk//50 |
            sed -n '/^\[Extension org\.freedesktop\.Sdk\.Extension\]$/,/^\[/{s/^version *= *//p}')
          if [ -z "$RUST_BRANCH" ]; then
            echo "Could not read the Freedesktop SDK extension branch from org.gnome.Sdk//50." >&2
            exit 1
          fi
          echo "Resolved rust-stable branch to $RUST_BRANCH"
          flatpak install -y --noninteractive flathub \
            "org.freedesktop.Sdk.Extension.rust-stable//${RUST_BRANCH}"

      - name: Build
        # Byte-for-byte release.yml's build command minus --repo and --gpg-sign.
        # Neither participates in flatpak-builder's per-module cache keys — they
        # only affect the export that happens after every module is built — so
        # the `build-opencascade` ref this produces is the one the release job
        # restores. Verified locally by alternating the two invocations against
        # one state dir: the second form still reported "Cache hit for
        # opencascade, skipping build".
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse --ccache \
            build-dir build-aux/io.github.SilkePilon.Scriber.yaml

      - name: Assert OCCT is dynamically linked in the shipped binary
        run: ./scripts/check-dynamic-occt.sh build-dir/files/bin/scriber

      - name: Run the shipped binary
        # The same assertions release.yml makes, and for the same reason they
        # live inside the sandbox there: --run gives the build a private /tmp,
        # so the output file does not exist out here.
        run: |
          set -euo pipefail
          flatpak-builder --run build-dir \
            build-aux/io.github.SilkePilon.Scriber.yaml \
            sh -euc '
              printf "body plate = cuboid(10, 10, 10)\nbody hole = cylinder(radius = 2, height = 10)\nbody part = cut(plate, hole)\nexport \"release-check.step\" from part\n" > /tmp/release-check.scr
              scriber build /tmp/release-check.scr
              head -c 13 /tmp/release-check.step | grep -q "ISO-10303-21;"
              grep -q "CYLINDRICAL_SURFACE" /tmp/release-check.step
            '
