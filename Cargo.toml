[workspace]
resolver = "3"
members = ["crates/scriber-kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SilkePilon/scriber"

[workspace.dependencies]
cxx = "1.0.130"
cxx-build = "1.0.130"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
